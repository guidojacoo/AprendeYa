# The scheduler. GitHub Actions is the clock; Vercel is the bot.
#
# Two things this workflow has to reconcile:
#
#   * GitHub's cron is best-effort. On the free hosted runners a `*/5` schedule
#     regularly fires 5-20 minutes late, and sometimes skips. You cannot land a
#     bid at 20:44:55 by hoping the cron is punctual.
#   * A market close IS punctual, to the second.
#
# So the cron is not asked to be precise. It only has to wake up SOMETIME inside
# the window before a deadline. /api/tick then answers "the next action is due in
# 214 seconds", and this job sleeps those 214 seconds on GitHub's runner — which
# is a free, accurate clock — before calling back in sniper mode to place the bid.
#
# VISIBILITY DECIDES THE CADENCE. This repository is public, so */5 works.
#
# On a PRIVATE repository GitHub bills every job rounded up to one minute — */5
# is ~8,600 minutes a month against a 2,000-minute allowance — and it
# deprioritises scheduled runs accordingly. A private repo on */5 does not get
# 288 runs a day; it gets none, which is exactly what this deployment saw for
# eighty minutes before the repo was made public. That is the platform declining
# to give away metered compute, not a bug to work around.
#
# So: if this repository ever goes private again, drop the cron to */30 and put
# an external one-minute cron (cron-job.org, free) in front of /api/tick instead.
# DEPLOY.md has the setup.

name: fantasybot tick

on:
  schedule:
    # Public repo: minutes are free and unmetered. Go back to */30 (plus an
    # external cron) if it is ever made private again.
    - cron: "*/5 * * * *"
  # Every deploy gets one tick. Not a convenience: the repair that points the
  # database's clock at this deployment — and settles the key they authenticate
  # with — runs INSIDE a tick, and a tick is what a broken clock cannot produce.
  # Something outside that circle has to fire once, and a push to main is the
  # one event that is guaranteed to happen when any of this changes.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Force the review even if it is not due by cadence"
        type: boolean
        default: false
      dry_run:
        description: "Decide everything, send nothing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_URL: ${{ vars.VERCEL_APP_URL }}
      SECRET: ${{ secrets.BOT_CRON_SECRET }}
      # Longest this job will hold the line waiting for a deadline. Keep it under
      # the job timeout, and mind the minute cost on a private repo.
      MAX_HOLD_SECONDS: "1200"
    steps:
      - name: Check configuration
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::VERCEL_APP_URL is not set. Add it under" \
                 "Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          if [ -z "$SECRET" ]; then
            echo "::error::BOT_CRON_SECRET is not set. Add it under" \
                 "Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi

      # Workflow inputs come in through `env`, never interpolated into the
      # script body: `${{ }}` inside a shell block is textual substitution, and
      # that is how a workflow ends up running whatever an input contained.
      - name: Tick, then hold for any imminent deadline
        env:
          FORCE_INPUT: ${{ inputs.force }}
          DRY_INPUT: ${{ inputs.dry_run }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail

          # A push fires this job and the Vercel build at the same moment, so an
          # immediate call reaches the deployment being replaced — which makes a
          # post-deploy check a check of the previous deploy. Wait for the build
          # before asking it anything.
          if [ "$EVENT" = "push" ]; then
            # Wait for THIS commit to be the one answering, not merely for time
            # to pass. A fixed sleep validates whichever build happens to be live
            # when it ends, and with deploys queued behind each other that is
            # regularly the previous one — three conclusions were drawn tonight
            # from output that came from a build other than the one pushed.
            echo "Waiting for ${GITHUB_SHA:0:7} to go live..."
            for _ in $(seq 1 20); do
              sleep 15
              LIVE="$(curl -sS --max-time 20 "${APP_URL}/api" | jq -r '.deploy // ""')"
              [ -n "$LIVE" ] && echo "  live: $LIVE"
              case "${GITHUB_SHA}" in
                "$LIVE"*) echo "  this is the build we pushed."; break ;;
              esac
            done
          fi

          # And then check the function we actually came to exercise. /api and
          # /api/tick are separate lambdas and they are NOT always serving the
          # same build: /api reported the pushed sha while /api/tick answered
          # with `deploy: null`, a field that exists in that very commit. Waiting
          # on the wrong one is how a check validates code that is not running.
          check_tick_build() {
            for _ in $(seq 1 10); do
              BODY="$(call tick)"
              TICK_SHA="$(echo "$BODY" | jq -r '.deploy // ""')"
              case "${GITHUB_SHA}" in
                "$TICK_SHA"*) [ -n "$TICK_SHA" ] && return 0 ;;
              esac
              echo "  /api/tick is still on ${TICK_SHA:-an older build}; waiting."
              sleep 20
            done
            echo "::warning::/api/tick never reported ${GITHUB_SHA:0:7}." \
                 "Everything below describes a DIFFERENT build."
            return 1
          }

          call() {
            # $1 = mode. Returns the JSON body; a transport failure yields {}.
            curl -sS --max-time 70 --retry 2 --retry-delay 3 \
                 -X POST \
                 -H "Authorization: Bearer ${SECRET}" \
                 -H "Content-Type: application/json" \
                 "${APP_URL}/api/tick?mode=$1&src=github&force=${FORCE:-0}&dry_run=${DRY:-0}" \
              || echo '{}'
          }

          FORCE=0; DRY=0
          [ "${FORCE_INPUT:-}" = "true" ] && FORCE=1
          [ "${DRY_INPUT:-}" = "true" ] && DRY=1
          # A deploy check that does not exercise the deploy is not a check. The
          # review is where nearly all the code lives, and on its own cadence it
          # is usually "not due" — so three deploys in a row reported a healthy
          # tick without the new code having run once. Forced here, the push
          # answers the only question a deploy raises: does it still work.
          if [ "$EVENT" = "push" ]; then FORCE=1; fi

          if [ "$EVENT" = "push" ]; then
            check_tick_build || true
          else
            BODY="$(call tick)"
          fi
          # The database wakes the bot every minute, so a deploy check can arrive
          # while one of those ticks already holds the review lock — and then it
          # checks nothing. Wait out the lock and ask once more.
          if [ "$EVENT" = "push" ] \
             && [ "$(echo "$BODY" | jq -r '.review.status // ""')" = "skipped" ] \
             && [ "$(echo "$BODY" | jq -r '.review.reason // ""')" != "not due" ]; then
            echo "Review was locked by another tick ($(echo "$BODY" | jq -r '.review.reason')). Retrying once."
            sleep 45
            BODY="$(call tick)"
          fi
          # The two functions, side by side. If /api and /api/tick report
          # different commits then Vercel is serving a per-function build cache
          # and a change to the shared package never reached the function whose
          # entrypoint did not change — which would explain an evening of fixes
          # that appeared not to take.
          echo "api=$(curl -sS --max-time 20 "${APP_URL}/api" | jq -r '.deploy // "?"')" \
               "tick=$(echo "$BODY" | jq -r '.deploy // "?"')"
          echo "$BODY" | jq -C '{ok, mode, deploy, duration_seconds, pending, next_deadline,
                                  sleep_seconds, actions, review: (.review.status // null),
                                  review_seconds: .review.seconds?,
                                  review_skipped: .review.skipped?,
                                  listings: {mode: .review.listings.mode?,
                                             listed: (.review.listings.listed | length?),
                                             would: (.review.listings.would_list | length?),
                                             left_out: .review.listings.left_out?},
                                  gaps: (.review.gaps // null),
                                  squad: (.review.squad // null),
                                  defensa: {modo: .review.defense.mode?,
                                            alcance_rival: .review.defense.rival_reach?,
                                            expuestos: (.review.defense.exposed | length?),
                                            subidas: (.review.defense.raises | length?),
                                            coste_por_euro: .review.defense.cost_ratio?},
                                  form: (.review.form // null),
                                  defensa_por_que: .review.defense.why?,
                                  cajas: .review.defense.reach_detail?,
                                  actividad: .review.defense.activity_shape?,
                                  minutos: .review.form.minutes?,
                                  pujas: {programadas: (.review.bids.scheduled | length?),
                                          embudo: .review.bids.funnel?,
                                          descartadas: .review.bids.skipped?},
                                  clausulas: {programadas: (.review.clauses.queued | length?),
                                              descartadas: (.review.clauses.skipped | length?)},
                                  ventas: {ofertas: .offers.offers?,
                                           leidas: .offers.read?,
                                           vendidas: (.offers.accepted | length?),
                                           en_pie: (.offers.held | length?),
                                           presion: .offers.pressure?,
                                           caja_despues: .offers.money_after?},
                                  recompensa: .reward,
                                  skipped_phases: (.review.skipped // null),
                                  clock, error}' 2>/dev/null || echo "$BODY"

          # The other clock, reported by the one that woke us. pg_cron cannot tell
          # you its calls are being refused — net.http_post only queues them — so
          # this run is the only place the failure is visible.
          if [ "$(echo "$BODY" | jq -r '(.clock.db_wakes_recent // 1) == 0')" = "true" ]; then
            echo "::warning::the database has woken the bot 0 times recently: $(echo "$BODY" | jq -c '.clock')"
          elif [ "$(echo "$BODY" | jq -r '.clock.scheduled // true')" != "true" ]; then
            echo "::warning::the database cron is not scheduled; apply supabase/migrations/0003_clock_status.sql"
          elif [ "$(echo "$BODY" | jq -r '(.clock.http_ok // 1) == 0 and (.clock.http_failed // 0) > 0')" = "true" ]; then
            echo "::warning::the database cron runs but Vercel refuses every call: $(echo "$BODY" | jq -c '.clock')"
          fi

          if [ "$(echo "$BODY" | jq -r '.ok // false')" != "true" ]; then
            echo "::error::tick failed: $(echo "$BODY" | jq -r '.error // "no response"')"
            # The trace, not just the message. Working out WHERE a KeyError came
            # from by reading the source cost a deploy cycle.
            echo "$BODY" | jq -r '.traceback // empty'
            exit 1
          fi

          # ---- hold the line ----------------------------------------------
          # Only when something is actually queued and near. Otherwise we exit
          # immediately and let the next cron do the next tick — no idle runner.
          HELD=0
          for i in $(seq 1 12); do
            SLEEP="$(echo "$BODY" | jq -r '.sleep_seconds // empty')"
            [ -z "$SLEEP" ] && { echo "Nothing queued. Done."; break; }

            LEFT=$(( MAX_HOLD_SECONDS - HELD ))
            if [ "$SLEEP" -gt "$LEFT" ]; then
              echo "Next action in ${SLEEP}s — beyond this job's hold budget (${LEFT}s left)."
              echo "A later cron run will pick it up."
              break
            fi

            # Wake a few seconds early: the function itself polls the market into
            # the final seconds, so it wants to already be running at T-5.
            WAIT=$(( SLEEP - 5 )); [ "$WAIT" -lt 0 ] && WAIT=0
            echo "Holding ${WAIT}s for an action due in ${SLEEP}s (iteration $i)..."
            sleep "$WAIT"
            HELD=$(( HELD + WAIT + 5 ))

            BODY="$(call sniper)"
            echo "$BODY" | jq -C '{ok, actions, next_deadline, sleep_seconds, error}' \
              2>/dev/null || echo "$BODY"
            if [ "$(echo "$BODY" | jq -r '.ok // false')" != "true" ]; then
              echo "::warning::sniper tick failed: $(echo "$BODY" | jq -r '.error // "?"')"
              break
            fi
          done
