name: fantasybot CI

on:
  push:
    paths: ["fantasybot-serverless/**", ".github/workflows/fantasybot-*.yml"]
  pull_request:
    paths: ["fantasybot-serverless/**", ".github/workflows/fantasybot-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: fantasybot-serverless

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # `-t .` matters: it makes discovery import tests/__init__.py, which pins
      # the storage backend to local. Without it the suite would inherit whatever
      # backend the environment (or a .env) is configured for.
      - name: Tests (standard library only)
        run: python -m unittest discover -s tests -t . -v

      - name: Compile every module
        run: python -m compileall -q fantasybot api scripts

      - name: Lint
        run: |
          python -m pip install --quiet ruff
          python -m ruff check .

      # Scoped by [tool.mypy] in pyproject.toml to the serverless layer — the
      # code that decides when money moves. A real gate, not a warning.
      - name: Type check
        run: |
          python -m pip install --quiet mypy
          python -m mypy
