<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AprendeYa</title>
  <link href="/styles/tailwind.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 p-4">
  <div id="app" class="max-w-xl mx-auto">

    <h1 class="text-2xl mb-4 font-bold text-center">AprendeYa</h1>

    <div id="login-register" class="mb-6">
      <input id="email" type="email" placeholder="email" class="border p-2 w-full mb-2" />
      <input id="password" type="password" placeholder="contraseña" class="border p-2 w-full mb-2" />
      <button id="btn-login" class="bg-blue-500 text-white p-2 w-full rounded">iniciar sesion / registrarse</button>
      <p id="error-msg" class="text-red-500 mt-2"></p>
    </div>

    <div id="user-panel" class="hidden">
      <p>Iniciado como <span id="user-email"></span></p>

      <div id="admin-panel" class="hidden mt-4">
        <h2 class="font-semibold mb-2">Agregar curso</h2>
        <input id="curso-titulo" placeholder="titulo" class="border p-2 w-full mb-2" />
        <input id="curso-nivel" placeholder="nivel (principiante, intermedio, avanzado)" class="border p-2 w-full mb-2" />
        <textarea id="curso-descripcion" placeholder="descripcion" class="border p-2 w-full mb-2"></textarea>
        <input id="curso-link" placeholder="link del curso" class="border p-2 w-full mb-2" />
        <button id="btn-agregar" class="bg-green-500 text-white p-2 w-full rounded">agregar curso</button>
        <p id="msg-curso" class="text-green-600 mt-2"></p>
      </div>

      <h2 class="font-semibold mt-6 mb-2">Cursos disponibles</h2>
      <ul id="lista-cursos" class="list-disc list-inside"></ul>
      <button id="btn-logout" class="mt-4 bg-red-500 text-white p-2 w-full rounded">cerrar sesion</button>
    </div>

  </div>

  <script src="/utils/authClient.js"></script>
  <script>
    const apiUrl = '/api'

    const loginRegisterDiv = document.getElementById('login-register')
    const userPanel = document.getElementById('user-panel')
    const userEmailSpan = document.getElementById('user-email')
    const adminPanel = document.getElementById('admin-panel')
    const errorMsg = document.getElementById('error-msg')
    const msgCurso = document.getElementById('msg-curso')

    function mostrarError(text) {
      errorMsg.textContent = text
      setTimeout(() => { errorMsg.textContent = '' }, 3000)
    }

    function mostrarMsgCurso(text) {
      msgCurso.textContent = text
      setTimeout(() => { msgCurso.textContent = '' }, 3000)
    }

    async function loginRegister() {
      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value.trim()
      if (!email || !password) {
        mostrarError('completa email y contraseña')
        return
      }

      try {
        // primero intentar login
        let res = await fetch(`${apiUrl}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        })

        if (res.status === 400) {
          // si usuario no existe, registrar
          res = await fetch(`${apiUrl}/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          })
          if (!res.ok) {
            const err = await res.json()
            mostrarError(err.error || 'error al registrar')
            return
          }
          // luego loguear al usuario registrado
          res = await fetch(`${apiUrl}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          })
        }

        if (!res.ok) {
          const err = await res.json()
          mostrarError(err.error || 'error al iniciar sesion')
          return
        }

        const data = await res.json()
        authClient.setToken(data.token)
        mostrarUserPanel()
      } catch {
        mostrarError('error de conexion')
      }
    }

    function mostrarUserPanel() {
      loginRegisterDiv.classList.add('hidden')
      userPanel.classList.remove('hidden')
      const token = authClient.getToken()
      if (!token) return logout()

      // decodificar token para obtener email (simple, sin libreria)
      const payload = JSON.parse(atob(token.split('.')[1]))
      userEmailSpan.textContent = payload.email

      // si es admin mostrar panel admin
      if (payload.email === 'admin@aprendeya.com') {
        adminPanel.classList.remove('hidden')
      } else {
        adminPanel.classList.add('hidden')
      }

      cargarCursos()
    }

    async function cargarCursos() {
      try {
        const res = await fetch(`${apiUrl}/cursos`)
        if (!res.ok) throw new Error()
        const cursos = await res.json()
        const lista = document.getElementById('lista-cursos')
        lista.innerHTML = ''
        cursos.forEach(curso => {
          const li = document.createElement('li')
          li.innerHTML = `<strong>${curso.titulo}</strong> (${curso.nivel}) - subido por ${curso.creador}<br>${curso.descripcion}<br><a href="${curso.link}" target="_blank" class="text-blue-600 underline">ver curso</a>`
          lista.appendChild(li)
        })
      } catch {
        mostrarError('no se pudieron cargar los cursos')
      }
    }

    async function agregarCurso() {
      const titulo = document.getElementById('curso-titulo').value.trim()
      const nivel = document.getElementById('curso-nivel').value.trim()
      const descripcion = document.getElementById('curso-descripcion').value.trim()
      const link = document.getElementById('curso-link').value.trim()

      if (!titulo || !nivel || !descripcion || !link) {
        mostrarError('completa todos los campos del curso')
        return
      }

      try {
        const res = await fetch(`${apiUrl}/cursos`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + authClient.getToken()
          },
          body: JSON.stringify({ titulo, nivel, descripcion, link })
        })
        if (!res.ok) {
          const err = await res.json()
          mostrarError(err.error || 'error al agregar curso')
          return
        }
        mostrarMsgCurso('curso agregado')
        cargarCursos()
        document.getElementById('curso-titulo').value = ''
        document.getElementById('curso-nivel').value = ''
        document.getElementById('curso-descripcion').value = ''
        document.getElementById('curso-link').value = ''
      } catch {
        mostrarError('error de conexion')
      }
    }

    function logout() {
      authClient.removeToken()
      userPanel.classList.add('hidden')
      loginRegisterDiv.classList.remove('hidden')
      userEmailSpan.textContent = ''
      adminPanel.classList.add('hidden')
    }

    document.getElementById('btn-login').addEventListener('click', loginRegister)
    document.getElementById('btn-agregar').addEventListener('click', agregarCurso)
    document.getElementById('btn-logout').addEventListener('click', logout)

    // al cargar pagina
    if (authClient.getToken()) mostrarUserPanel()
  </script>
</body>
</html>
