<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AprendeYa</title>
  <link href="/styles/tailwind.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div id="app" class="bg-white rounded-lg shadow-lg max-w-3xl w-full p-8">

    <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">aprendeya</h1>

    <div id="login-register" class="max-w-md mx-auto">
      <input id="email" type="email" placeholder="email" class="border border-gray-300 rounded-md p-3 w-full mb-4 focus:outline-blue-500" />
      <input id="password" type="password" placeholder="contraseña" class="border border-gray-300 rounded-md p-3 w-full mb-4 focus:outline-blue-500" />
      <button id="btn-login" class="bg-blue-600 text-white rounded-md w-full py-3 font-semibold hover:bg-blue-700 transition">iniciar sesion / registrarse</button>
      <p id="error-msg" class="text-red-500 mt-2 text-center"></p>
    </div>

    <div id="user-panel" class="hidden">
      <p class="text-gray-700 mb-4 text-center">iniciado como <span id="user-email" class="font-semibold"></span></p>

      <div id="admin-panel" class="hidden bg-gray-50 p-6 rounded-md shadow-inner max-w-md mx-auto mb-6">
        <h2 class="font-semibold text-xl mb-4 text-gray-800">agregar curso</h2>
        <input id="curso-titulo" placeholder="titulo" class="border border-gray-300 rounded-md p-3 w-full mb-3 focus:outline-blue-500" />
        <input id="curso-nivel" placeholder="nivel (principiante, intermedio, avanzado)" class="border border-gray-300 rounded-md p-3 w-full mb-3 focus:outline-blue-500" />
        <textarea id="curso-descripcion" placeholder="descripcion" class="border border-gray-300 rounded-md p-3 w-full mb-3 resize-none focus:outline-blue-500" rows="3"></textarea>
        <input id="curso-link" placeholder="link del curso" class="border border-gray-300 rounded-md p-3 w-full mb-4 focus:outline-blue-500" />
        <button id="btn-agregar" class="bg-green-600 text-white rounded-md w-full py-3 font-semibold hover:bg-green-700 transition">agregar curso</button>
        <p id="msg-curso" class="text-green-600 mt-2 text-center"></p>
      </div>

      <h2 class="font-semibold text-2xl mb-4 text-gray-800 text-center">cursos disponibles</h2>
      <ul id="lista-cursos" class="max-w-3xl mx-auto space-y-4">
        <!-- cursos aqui -->
      </ul>

      <button id="btn-logout" class="mt-8 bg-red-600 text-white rounded-md w-full py-3 font-semibold hover:bg-red-700 transition">cerrar sesion</button>
    </div>

  </div>

  <script src="/utils/authClient.js"></script>
  <script>
    const apiUrl = '/api'

    const loginRegisterDiv = document.getElementById('login-register')
    const userPanel = document.getElementById('user-panel')
    const userEmailSpan = document.getElementById('user-email')
    const adminPanel = document.getElementById('admin-panel')
    const errorMsg = document.getElementById('error-msg')
    const msgCurso = document.getElementById('msg-curso')

    function mostrarError(text) {
      errorMsg.textContent = text
      setTimeout(() => { errorMsg.textContent = '' }, 3000)
    }

    function mostrarMsgCurso(text) {
      msgCurso.textContent = text
      setTimeout(() => { msgCurso.textContent = '' }, 3000)
    }

    async function loginRegister() {
      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value.trim()
      if (!email || !password) {
        mostrarError('completa email y contraseña')
        return
      }

      try {
        let res = await fetch(`${apiUrl}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        })

        if (res.status === 400) {
          res = await fetch(`${apiUrl}/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          })
          if (!res.ok) {
            const err = await res.json()
            mostrarError(err.error || 'error al registrar')
            return
          }
          res = await fetch(`${apiUrl}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          })
        }

        if (!res.ok) {
          const err = await res.json()
          mostrarError(err.error || 'error al iniciar sesion')
          return
        }

        const data = await res.json()
        authClient.setToken(data.token)
        mostrarUserPanel()
      } catch {
        mostrarError('error de conexion')
      }
    }

    function mostrarUserPanel() {
      loginRegisterDiv.classList.add('hidden')
      userPanel.classList.remove('hidden')
      const token = authClient.getToken()
      if (!token) return logout()

      const payload = JSON.parse(atob(token.split('.')[1]))
      userEmailSpan.textContent = payload.email

      if (payload.email === 'admin@aprendeya.com') {
        adminPanel.classList.remove('hidden')
      } else {
        adminPanel.classList.add('hidden')
      }

      cargarCursos()
    }

    async function cargarCursos() {
      try {
        const res = await fetch(`${apiUrl}/cursos`)
        if (!res.ok) throw new Error()
        const cursos = await res.json()
        const lista = document.getElementById('lista-cursos')
        lista.innerHTML = ''
        cursos.forEach(curso => {
          const li = document.createElement('li')
          li.className = "bg-white p-4 rounded shadow hover:shadow-md transition"
          li.innerHTML = `
            <h3 class="font-bold text-lg text-gray-800">${curso.titulo}</h3>
            <p class="text-sm text-gray-500 mb-1">nivel: ${curso.nivel} | subido por: ${curso.creador}</p>
            <p class="text-gray-700 mb-2">${curso.descripcion}</p>
            <a href="${curso.link}" target="_blank" class="text-blue-600 hover:underline">ver curso</a>
          `
          lista.appendChild(li)
        })
      } catch {
        mostrarError('no se pudieron cargar los cursos')
      }
    }

    async function agregarCurso() {
      const titulo = document.getElementById('curso-titulo').value.trim()
      const nivel = document.getElementById('curso-nivel').value.trim()
      const descripcion = document.getElementById('curso-descripcion').value.trim()
      const link = document.getElementById('curso-link').value.trim()

      if (!titulo || !nivel || !descripcion || !link) {
        mostrarError('completa todos los campos del curso')
        return
      }

      try {
        const res = await fetch(`${apiUrl}/cursos`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + authClient.getToken()
          },
          body: JSON.stringify({ titulo, nivel, descripcion, link })
        })
        if (!res.ok) {
          const err = await res.json()
          mostrarError(err.error || 'error al agregar curso')
          return
        }
        mostrarMsgCurso('curso agregado')
        cargarCursos()
        document.getElementById('curso-titulo').value = ''
        document.getElementById('curso-nivel').value = ''
        document.getElementById('curso-descripcion').value = ''
        document.getElementById('curso-link').value = ''
      } catch {
        mostrarError('error de conexion')
      }
    }

    function logout() {
      authClient.removeToken()
      userPanel.classList.add('hidden')
      loginRegisterDiv.classList.remove('hidden')
      userEmailSpan.textContent = ''
      adminPanel.classList.add('hidden')
    }

    document.getElementById('btn-login').addEventListener('click', loginRegister)
    document.getElementById('btn-agregar').addEventListener('click', agregarCurso)
    document.getElementById('btn-logout').addEventListener('click', logout)

    if (authClient.getToken()) mostrarUserPanel()
  </script>
</body>
</html>
